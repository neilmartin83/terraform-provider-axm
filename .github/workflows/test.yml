name: Tests

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "README.md"
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true
      - run: go mod download
      - run: go build -v .
      - name: Run linters
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest

  generate:
    name: Docs Generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - run: make generate
      - name: git diff
        run: |
          git diff --compact-summary --exit-code || \
            (echo; echo "Unexpected difference in directories after code generation. Run 'make generate' command and commit."; exit 1)

  unit:
    name: Unit Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: true
      - run: go mod download
      - run: go test -v -cover -count=1 ./...

  acceptance:
    name: Acceptance Tests (Terraform ${{ matrix.terraform }})
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        terraform:
          - "1.13.*"
          - "1.14.*"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - run: go mod download
      - run: go test -v -cover -count=1 -p=1 ./...
        timeout-minutes: 10
        env:
          TF_ACC: "1"
          AXM_CLIENT_ID: ${{ secrets.AXM_CLIENT_ID }}
          AXM_KEY_ID: ${{ secrets.AXM_KEY_ID }}
          AXM_PRIVATE_KEY: ${{ secrets.AXM_PRIVATE_KEY }}
          AXM_SCOPE: ${{ secrets.AXM_SCOPE }}
          AXM_TEST_SERVER_ID: ${{ secrets.AXM_TEST_SERVER_ID }}
          AXM_TEST_DEVICE_SERIAL_1: ${{ secrets.AXM_TEST_DEVICE_SERIAL_1 }}
          AXM_TEST_DEVICE_SERIAL_2: ${{ secrets.AXM_TEST_DEVICE_SERIAL_2 }}
          AXM_TEST_DEVICE_SERIAL_3: ${{ secrets.AXM_TEST_DEVICE_SERIAL_3 }}
          AXM_TEST_DEVICE_ID: ${{ secrets.AXM_TEST_DEVICE_ID }}
          AXM_TEST_ASSIGNED_DEVICE_ID: ${{ secrets.AXM_TEST_ASSIGNED_DEVICE_ID }}
          AXM_TEST_DEVICE_WITH_COVERAGE_ID: ${{ secrets.AXM_TEST_DEVICE_WITH_COVERAGE_ID }}
